# Configuración específica para Docker
server.port=8080

# Configuración de base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/gestion_gimnasios
spring.datasource.username=gym_user
spring.datasource.password=gym_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# CORS para el frontend en Docker
cors.allowed.origins=http://localhost:3000

# Configuración de logging
logging.level.com.tfg.gestion_gimnasios=INFO
logging.level.org.springframework.security=WARN

# Configuración de JWT (usar variables de entorno en producción)
jwt.secret=mySecretKey
jwt.expiration=86400000

# Actuator para health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always